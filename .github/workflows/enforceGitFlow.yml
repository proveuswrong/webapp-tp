name: Enforce Git Flow

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  check_base_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only release and hotfix branches into main
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(release|hotfix)/ ]]; then
            echo "Error: only a branch whose name starts with 'release/' or 'hotfix/' may be merged into 'main'."
            exit 1
          fi
